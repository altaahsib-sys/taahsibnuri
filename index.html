<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuri Taahsib Mart</title><meta name="theme-color" content="#0b0f19">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--cy:#22d3ee;--pk:#ff2e97;--pu:#a855f7;--rd:#e11d48;--gd:#fbbf24}
body{background:radial-gradient(900px 500px at 15% -10%,rgba(168,85,247,.22),transparent),radial-gradient(800px 500px at 100% 10%,rgba(34,211,238,.14),transparent),#0b0f19;color:#e8ecf5;font-family:Sora,system-ui,sans-serif;min-height:100vh;padding-bottom:120px}
.glass{background:rgba(255,255,255,.05);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:22px}
.neon-t{background:linear-gradient(90deg,var(--cy),var(--pu),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(90deg,var(--cy),var(--pu));color:#06101c;font-weight:700;border-radius:16px;padding:.7rem 1.1rem;box-shadow:0 0 18px rgba(34,211,238,.45);transition:transform .2s}
.btn:active{transform:scale(.95)}.btn.pk{background:linear-gradient(90deg,var(--pu),var(--pk));color:#fff;box-shadow:0 0 18px rgba(255,46,151,.45)}
.btn.gh{background:rgba(255,255,255,.08);color:#e8ecf5;box-shadow:none;border:1px solid rgba(255,255,255,.15)}
.tag{background:linear-gradient(90deg,var(--rd),var(--gd));color:#1c0a00;font-weight:800;border-radius:999px;padding:.15rem .6rem;font-size:.72rem}
.fl{border:1px solid rgba(251,191,36,.55);box-shadow:0 0 24px rgba(225,29,72,.35);background:linear-gradient(120deg,rgba(225,29,72,.25),rgba(251,191,36,.12))}
.inp{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:.65rem .9rem;color:#fff;outline:none}
.inp:focus{border-color:var(--cy);box-shadow:0 0 12px rgba(34,211,238,.4)}
.card{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;transform:perspective(800px) translateZ(0);will-change:transform}
.card:hover{transform:perspective(800px) rotateX(3deg) translateY(-4px);box-shadow:0 12px 34px rgba(168,85,247,.35)}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(94vw,440px);z-index:40;padding:6px;border-radius:30px;background:rgba(20,26,44,.55);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2)}
#dock .in{position:relative;display:flex}
#pill{position:absolute;top:0;bottom:0;left:0;width:20%;border-radius:24px;background:linear-gradient(135deg,rgba(34,211,238,.35),rgba(168,85,247,.35));box-shadow:0 0 22px rgba(34,211,238,.5);transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.dk{position:relative;flex:1;padding:.6rem 0;text-align:center;font-size:.62rem;color:#9aa6c2;transition:color .3s}.dk i{display:block;font-size:1.15rem;margin-bottom:2px}.dk.on{color:#fff}
.dk .bd{position:absolute;top:2px;right:22%;background:var(--rd);color:#fff;border-radius:99px;font-size:.6rem;padding:0 5px}
#splash{position:fixed;inset:0;z-index:100;background:#070a12;transition:opacity .8s}
#splash .tx{position:absolute;left:0;right:0;text-align:center;padding:0 1rem}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-140%);z-index:90;transition:transform .5s cubic-bezier(.3,1.4,.5,1);padding:.7rem 1.2rem}
#toast.s{transform:translate(-50%,0)}
.b{max-width:80%;padding:.55rem .85rem;border-radius:16px;margin:.3rem 0;font-size:.9rem}.b.u{margin-left:auto;background:linear-gradient(90deg,var(--cy),var(--pu));color:#06101c}.b.a{background:rgba(255,255,255,.09)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div id="splash"><canvas id="c3" style="width:100%;height:100%"></canvas>
<div class="tx" style="top:9%"><h1 class="text-2xl font-extrabold neon-t">Welcome to the Nuri &amp; Taahsib mart and enjoy!!</h1></div>
<div class="tx" style="bottom:8%"><p class="text-sm text-white/90">Powered by <b class="neon-t">Taahsib Akid</b></p><p class="text-xs text-white/40 mt-2">Tap to skip</p></div></div>
<div id="toast" class="glass"></div>
<main id="app" class="max-w-3xl mx-auto px-4 pt-4"></main>
<nav id="dock"><div class="in"><div id="pill"></div>
<a class="dk" href="#shop"><i class="fa-solid fa-bag-shopping"></i>Shop</a>
<a class="dk" href="#cart"><i class="fa-solid fa-cart-shopping"></i>Cart<span id="cb" class="bd hidden"></span></a>
<a class="dk" href="#orders"><i class="fa-solid fa-box"></i>Orders</a>
<a class="dk" href="#chat"><i class="fa-solid fa-comment-dots"></i>Chat</a>
<a class="dk" href="#profile"><i class="fa-solid fa-user"></i>Profile</a></div></nav>
<script>
/* ===== 1. FIREBASE CONFIG: paste yours from Firebase console > Project settings > Web app ===== */
firebase.initializeApp({apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",appId:"YOUR_APP_ID"});
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);
const ADMIN_PASS="Taahsibnuri009",INFO={town:"Sreepur, Gazipur, Dhaka, Bangladesh",wa:"01343386303",mail:"altaahsib@gmail.com"};
const S={user:null,prof:null,prods:[],cfg:{},orders:[],all:[],chat:[{r:'a',t:"Hi! I'm the Nuri Taahsib Mart assistant. Ask me about products, flash sales, coupons, delivery or contacting the admin."}],
 cart:JSON.parse(localStorage.getItem('cart')||'[]'),coupon:localStorage.getItem('coupon')||'',adm:sessionStorage.getItem('adm')==='1',img:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tk=s=>'৳'+Math.round(s).toLocaleString();
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('s');setTimeout(()=>t.classList.remove('s'),3200)}
/* ===== Flash sale / pricing (all admin-controlled via config/store) ===== */
const flash=()=>{const f=S.cfg.flash;return f&&f.on&&f.expiresAt>Date.now()?f:null};
const price=p=>flash()?p.price*(1-flash().pct/100):p.price;
const coupon=()=>(S.cfg.coupons||[]).find(c=>c.on&&c.code===S.coupon.toUpperCase());
function totals(){const sub=S.cart.reduce((a,i)=>{const p=S.prods.find(x=>x.id===i.id);return a+(p?price(p)*i.q:0)},0);
 const orig=S.cart.reduce((a,i)=>{const p=S.prods.find(x=>x.id===i.id);return a+(p?p.price*i.q:0)},0);
 const c=coupon(),cd=c?sub*c.pct/100:0;return{orig,sub,fd:orig-sub,cd,total:sub-cd}}
const saveCart=()=>{localStorage.setItem('cart',JSON.stringify(S.cart));const n=S.cart.reduce((a,i)=>a+i.q,0);$('cb').textContent=n;$('cb').classList.toggle('hidden',!n)};
/* ===== Live data ===== */
db.doc('config/store').onSnapshot(d=>{S.cfg=d.exists?d.data():{};live()});
db.collection('products').onSnapshot(s=>{S.prods=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));live()});
let unO=null,unA=null;
auth.onAuthStateChanged(async u=>{S.user=u;unO&&unO();unA&&unA();S.orders=[];S.all=[];
 if(u){const r=db.doc('users/'+u.uid),d=await r.get();S.prof=d.exists?d.data():{name:u.displayName,photo:u.photoURL};if(!d.exists)await r.set(S.prof);
  unO=db.collection('orders').where('uid','==',u.uid).onSnapshot(s=>{S.orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);live()});
  if(S.adm)watchAll()}else S.prof=null;route()});
function watchAll(){unA&&unA();unA=db.collection('orders').onSnapshot(s=>{S.all=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);live()},e=>toast('Admin read blocked: check Firestore rules'))}
function live(){const p=pg()[0];if(p==='admin'){if(S.adm)adminLive()}else if(p!=='chat'&&p!=='profile')route()}
/* ===== Router ===== */
const pg=()=>(location.hash.slice(1)||'shop').split('/');
function route(){const[p,a]=pg(),A=$('app');saveCart();
 const idx={shop:0,product:0,cart:1,orders:2,chat:3,profile:4,admin:4}[p]??0;$('pill').style.transform=`translateX(${idx*100}%)`;
 document.querySelectorAll('.dk').forEach((e,i)=>e.classList.toggle('on',i===idx));
 A.innerHTML=({shop,product:()=>product(a),cart,orders,chat,profile,admin})[p]?.()||shop();
 if(p==='chat')$('cl').scrollTop=1e9; if(p==='admin'&&S.adm)adminLive()}
addEventListener('hashchange',route);
const head=t=>`<header class="glass flex items-center justify-between px-4 py-3 mb-4 sticky top-3 z-30"><h1 class="font-extrabold text-lg neon-t">${t}</h1><i class="fa-solid fa-bolt" style="color:var(--gd)"></i></header>`;
function ticker(){const f=flash();if(!f)return;const s=Math.max(0,f.expiresAt-Date.now()),e=$('tm');if(e)e.textContent=[s/36e5|0,(s/6e4|0)%60,(s/1e3|0)%60].map(n=>String(n).padStart(2,'0')).join(':');if(s<=0)route()}
setInterval(ticker,1000);
/* ===== Pages ===== */
function shop(){const f=flash();return head('Nuri Taahsib Mart')+(f?`<div class="glass fl p-4 mb-4 flex items-center justify-between"><div><span class="tag">FLASH -${f.pct}%</span><h2 class="font-bold mt-1">${esc(f.title)}</h2></div><div class="text-right"><p class="text-xs text-white/60">Ends in</p><p id="tm" class="font-extrabold text-xl" style="color:var(--gd)">--:--:--</p></div></div>`:'')+
 (S.prods.length?`<div class="grid grid-cols-2 gap-3">${S.prods.map(p=>`<a href="#product/${p.id}" class="glass card overflow-hidden block"><div class="relative"><img src="${p.img}" alt="${esc(p.name)}" class="w-full h-36 object-cover">${f?`<span class="tag absolute top-2 left-2">-${f.pct}%</span>`:''}</div><div class="p-3"><p class="font-semibold text-sm truncate">${esc(p.name)}</p><p class="mt-1"><b style="color:${f?'var(--gd)':'var(--cy)'}">${tk(price(p))}</b> ${f?`<s class="text-xs text-white/40">${tk(p.price)}</s>`:''}</p></div></a>`).join('')}</div>`:`<div class="glass p-8 text-center text-white/60">No products yet. The admin can add some from the dashboard.</div>`)}
function product(id){const p=S.prods.find(x=>x.id===id);if(!p)return head('Product')+'<p class="text-white/60">Product not found.</p>';const f=flash();
 return head('Details')+`<div class="glass overflow-hidden"><img src="${p.img}" class="w-full h-64 object-cover" alt=""><div class="p-4"><div class="flex justify-between items-start"><h2 class="text-xl font-bold">${esc(p.name)}</h2>${f?`<span class="tag">-${f.pct}%</span>`:''}</div>
 <p class="my-2"><b class="text-2xl" style="color:${f?'var(--gd)':'var(--cy)'}">${tk(price(p))}</b> ${f?`<s class="text-white/40">${tk(p.price)}</s>`:''}</p><p class="text-sm text-white/70 mb-4">${esc(p.desc)}</p>
 <button class="btn w-full" onclick="add('${p.id}')"><i class="fa-solid fa-cart-plus mr-2"></i>Add to Cart</button></div></div>`}
function add(id){const i=S.cart.find(x=>x.id===id);i?i.q++:S.cart.push({id,q:1});saveCart();toast('Added to cart 🛒')}
function qty(id,d){const i=S.cart.find(x=>x.id===id);i.q+=d;if(i.q<1)S.cart=S.cart.filter(x=>x!==i);route()}
function cart(){S.cart=S.cart.filter(i=>S.prods.find(p=>p.id===i.id)||!S.prods.length);if(!S.cart.length)return head('Cart')+'<div class="glass p-8 text-center text-white/60">Your cart is empty. <a href="#shop" class="underline" style="color:var(--cy)">Browse the shop</a></div>';
 const t=totals(),c=coupon();return head('Cart')+S.cart.map(i=>{const p=S.prods.find(x=>x.id===i.id);return p?`<div class="glass p-3 mb-3 flex gap-3 items-center"><img src="${p.img}" class="w-16 h-16 rounded-xl object-cover" alt=""><div class="flex-1"><p class="font-semibold text-sm">${esc(p.name)}</p><p class="text-sm" style="color:var(--cy)">${tk(price(p))}</p></div><div class="flex items-center gap-2"><button class="btn gh" style="padding:.2rem .7rem" onclick="qty('${p.id}',-1)">-</button><b>${i.q}</b><button class="btn gh" style="padding:.2rem .7rem" onclick="qty('${p.id}',1)">+</button></div></div>`:''}).join('')+
 `<div class="glass p-4 mb-3 flex gap-2"><input id="cp" class="inp" placeholder="Coupon code" value="${esc(S.coupon)}"><button class="btn pk" onclick="applyCp()">Apply</button></div>
 <div class="glass p-4 space-y-1 text-sm"><div class="flex justify-between"><span>Subtotal</span><span>${tk(t.orig)}</span></div>${t.fd>0?`<div class="flex justify-between" style="color:var(--gd)"><span>Flash sale</span><span>-${tk(t.fd)}</span></div>`:''}${c?`<div class="flex justify-between" style="color:var(--gd)"><span>Coupon ${esc(c.code)} (${c.pct}%)</span><span>-${tk(t.cd)}</span></div>`:''}<div class="flex justify-between text-lg font-extrabold pt-2 border-t border-white/10"><span>Total</span><span class="neon-t">${tk(t.total)}</span></div></div>
 <button id="co" class="btn w-full mt-4" onclick="checkout()"><i class="fa-solid fa-location-crosshairs mr-2"></i>Checkout with live GPS</button>`}
function applyCp(){S.coupon=$('cp').value.trim();localStorage.setItem('coupon',S.coupon);if(!S.coupon||coupon())toast(S.coupon?'Coupon applied ✅':'Coupon removed');else toast('That coupon is not active');route()}
function checkout(){if(!S.user){toast('Sign in with Google first');location.hash='profile';return}
 if(!navigator.geolocation)return toast('GPS is not supported on this device');$('co').textContent='Getting your location...';
 navigator.geolocation.getCurrentPosition(async pos=>{const t=totals();
  await db.collection('orders').add({uid:S.user.uid,name:S.prof?.name||'',items:S.cart.map(i=>{const p=S.prods.find(x=>x.id===i.id);return{id:i.id,name:p.name,q:i.q,unit:price(p)}}),total:t.total,coupon:coupon()?.code||'',flash:flash()?.title||'',lat:pos.coords.latitude,lng:pos.coords.longitude,status:'pending',at:Date.now()});
  S.cart=[];S.coupon='';localStorage.removeItem('coupon');toast('Order placed with GPS location 📍');location.hash='orders';route()},
  ()=>{toast('Allow location access to place your order');route()},{enableHighAccuracy:true,timeout:15000})}
const stat=s=>s==='published'?'<span class="tag">Accepted</span>':'<span class="text-xs px-2 py-0.5 rounded-full bg-white/10">Awaiting admin</span>';
function orders(){if(!S.user)return head('Orders')+'<div class="glass p-8 text-center text-white/60">Sign in to see your orders on any device.</div>';
 return head('Orders')+(S.orders.length?S.orders.map(o=>`<div class="glass p-4 mb-3"><div class="flex justify-between mb-1"><b>${tk(o.total)}</b>${stat(o.status)}</div><p class="text-xs text-white/60">${new Date(o.at).toLocaleString()}</p><p class="text-sm mt-1">${o.items.map(i=>esc(i.name)+' ×'+i.q).join(', ')}</p><a target="_blank" rel="noopener" class="text-xs underline" style="color:var(--cy)" href="https://maps.google.com/?q=${o.lat},${o.lng}"><i class="fa-solid fa-location-dot"></i> ${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}</a></div>`).join(''):'<div class="glass p-8 text-center text-white/60">No orders yet.</div>')}
/* ===== Chat assistant (rule-based, knows catalogue + admin contact) ===== */
function bot(q){q=q.toLowerCase();const f=flash();
 if(/contact|admin|whatsapp|phone|email|mail|hometown|where/.test(q))return `Admin contact:\nHometown: ${INFO.town}\nWhatsApp: ${INFO.wa}\nEmail: ${INFO.mail}`;
 if(/flash|sale|offer|discount/.test(q))return f?`Flash sale is ON: "${f.title}", ${f.pct}% off everything, ending ${new Date(f.expiresAt).toLocaleString()}.`:'No flash sale right now. Check back soon!';
 if(/coupon|code|promo/.test(q)){const l=(S.cfg.coupons||[]).filter(c=>c.on);return l.length?'Active coupons: '+l.map(c=>c.code+' ('+c.pct+'% off)').join(', '):'No active coupons at the moment.'}
 if(/deliver|ship|track|gps|order/.test(q))return 'At checkout we capture your live GPS location so the admin can deliver to you. Track the status on the Orders tab: it changes to Accepted once the admin approves.';
 const m=S.prods.filter(p=>q.includes(p.name.toLowerCase())||p.name.toLowerCase().split(' ').some(w=>w.length>3&&q.includes(w)));
 if(m.length)return m.slice(0,3).map(p=>`${p.name}: ${tk(price(p))}. ${p.desc}`).join('\n\n');
 if(/product|price|catalog|have|sell|list|what/.test(q))return S.prods.length?'We have: '+S.prods.slice(0,8).map(p=>p.name+' ('+tk(price(p))+')').join(', '):'The catalogue is empty right now.';
 return 'I can help with products, prices, flash sales, coupons, delivery and admin contact. What would you like to know?'}
function chat(){return head('Assistant')+`<div id="cl" class="glass p-3 overflow-y-auto" style="height:56vh">${S.chat.map(m=>`<div class="b ${m.r}" style="white-space:pre-line">${esc(m.t)}</div>`).join('')}</div><div class="flex gap-2 mt-3"><input id="ci" class="inp" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()"><i class="fa-solid fa-paper-plane"></i></button></div>`}
function send(){const i=$('ci'),v=i.value.trim();if(!v)return;S.chat.push({r:'u',t:v},{r:'a',t:bot(v)});route()}
/* ===== Profile ===== */
function profile(){if(!S.user)return head('Profile')+`<div class="glass p-8 text-center"><p class="mb-4 text-white/70">Sign in to sync your cart, orders and profile across devices.</p><button class="btn" onclick="login()"><i class="fa-brands fa-google mr-2"></i>Continue with Google</button></div>`+admLink();
 return head('Profile')+`<div class="glass p-5 text-center"><img src="${esc(S.prof?.photo||S.user.photoURL||'')}" referrerpolicy="no-referrer" class="w-24 h-24 rounded-full mx-auto mb-3" style="box-shadow:0 0 22px var(--pu)" alt=""><p class="text-xs text-white/50 mb-3">${esc(S.user.email)}</p><input id="un" class="inp text-center" value="${esc(S.prof?.name||'')}" maxlength="30"><button class="btn w-full mt-3" onclick="saveName()">Save username</button><button class="btn gh w-full mt-3" onclick="auth.signOut()">Sign out</button></div>`+admLink()}
const admLink=()=>`<div class="text-center mt-6"><a href="#admin" class="text-xs text-white/40 underline">Admin dashboard</a></div>`;
function login(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(()=>toast('Google Authentication Successful! 🎉')).catch(e=>toast('Sign-in failed: '+e.code))}
async function saveName(){const n=$('un').value.trim();if(!n)return toast('Username cannot be empty');await db.doc('users/'+S.user.uid).set({name:n},{merge:true});S.prof.name=n;toast('Username updated ✅')}
/* ===== Admin Dashboard V2 ===== */
function admin(){if(!S.adm)return head('Admin V2')+`<div class="glass p-6"><p class="text-sm text-white/60 mb-3">Enter the master password</p><input id="ap" type="password" class="inp" onkeydown="if(event.key==='Enter')adLogin()"><button class="btn pk w-full mt-3" onclick="adLogin()">Unlock</button></div>`;
 const f=S.cfg.flash||{};return head('Admin V2')+`
 <section class="glass p-4 mb-4"><div class="flex justify-between items-center mb-3"><h2 class="font-bold">Flash sale</h2><label class="flex items-center gap-2 text-sm"><span>${flash()?'LIVE':'OFF'}</span><input type="checkbox" class="w-6 h-6" ${flash()?'checked':''} onchange="flashToggle(this.checked)"></label></div>
 <input id="ft" class="inp mb-2" placeholder="Event title" value="${esc(f.title||'')}"><div class="grid grid-cols-2 gap-2"><input id="fp" type="number" min="1" max="90" class="inp" placeholder="Discount %" value="${f.pct||''}"><input id="fh" type="number" min="1" class="inp" placeholder="Hours" value="${f.hours||''}"></div><button class="btn pk w-full mt-3" onclick="flashSave()">Save &amp; start flash sale</button></section>
 <section class="glass p-4 mb-4"><h2 class="font-bold mb-3">Coupons</h2><div class="grid grid-cols-3 gap-2"><input id="cc" class="inp col-span-2" placeholder="CODE"><input id="cpc" type="number" class="inp" placeholder="%"></div><button class="btn w-full mt-2" onclick="cpAdd()">Add coupon</button><div id="cl2" class="mt-3"></div></section>
 <section class="glass p-4 mb-4"><h2 class="font-bold mb-3">Upload product</h2><input type="file" accept="image/*" class="text-xs mb-2" onchange="pic(this)"><img id="pv" class="hidden w-24 h-24 rounded-xl object-cover mb-2" alt=""><input id="pn" class="inp mb-2" placeholder="Product name"><input id="pp" type="number" class="inp mb-2" placeholder="Price (৳)"><textarea id="pd" class="inp mb-2" rows="3" placeholder="Description"></textarea><div class="flex gap-2"><button class="btn gh flex-1" onclick="aiDesc()">✨ Write description</button><button class="btn flex-1" onclick="pAdd()">Publish</button></div><div id="pl" class="mt-3"></div></section>
 <section class="glass p-4"><h2 class="font-bold mb-3">Live orders &amp; GPS</h2><div id="ol"></div></section><button class="btn gh w-full mt-4" onclick="sessionStorage.clear();S.adm=false;route()">Lock dashboard</button>`}
function adLogin(){if($('ap').value===ADMIN_PASS){S.adm=true;sessionStorage.setItem('adm','1');watchAll();route()}else toast('Wrong password')}
function adminLive(){const c=$('cl2');if(!c)return;
 c.innerHTML=(S.cfg.coupons||[]).map((x,i)=>`<div class="flex items-center justify-between py-1 text-sm"><b>${esc(x.code)} · ${x.pct}%</b><span><button class="btn gh" style="padding:.2rem .6rem" onclick="cpTog(${i})">${x.on?'ON':'OFF'}</button> <button class="btn gh" style="padding:.2rem .6rem" onclick="cpDel(${i})"><i class="fa-solid fa-trash"></i></button></span></div>`).join('')||'<p class="text-xs text-white/50">No coupons yet.</p>';
 $('pl').innerHTML=S.prods.map(p=>`<div class="flex items-center gap-2 py-1 text-sm"><img src="${p.img}" class="w-10 h-10 rounded-lg object-cover" alt=""><span class="flex-1 truncate">${esc(p.name)} · ${tk(p.price)}</span><button class="btn gh" style="padding:.2rem .6rem" onclick="pDel('${p.id}')"><i class="fa-solid fa-trash"></i></button></div>`).join('');
 $('ol').innerHTML=S.all.map(o=>`<div class="rounded-2xl bg-white/5 p-3 mb-2 text-sm"><div class="flex justify-between"><b>${esc(o.name)||'Customer'} · ${tk(o.total)}</b>${stat(o.status)}</div><p class="text-xs text-white/60">${new Date(o.at).toLocaleString()}${o.coupon?' · '+esc(o.coupon):''}</p><p>${o.items.map(i=>esc(i.name)+' ×'+i.q).join(', ')}</p><a target="_blank" rel="noopener" class="text-xs underline" style="color:var(--cy)" href="https://maps.google.com/?q=${o.lat},${o.lng}"><i class="fa-solid fa-location-dot"></i> ${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}</a>${o.status!=='published'?`<button class="btn w-full mt-2" onclick="accept('${o.id}')">Accept &amp; Publish Order</button>`:''}</div>`).join('')||'<p class="text-xs text-white/50">No orders yet.</p>'}
const setCfg=d=>db.doc('config/store').set(d,{merge:true}).then(()=>toast('Saved ✅')).catch(()=>toast('Write blocked: check Firestore rules'));
function flashToggle(on){const f=S.cfg.flash||{};setCfg({flash:{...f,on,expiresAt:on?Math.max(f.expiresAt||0,Date.now()+(f.hours||1)*36e5):0}})}
function flashSave(){const pct=+$('fp').value,h=+$('fh').value,t=$('ft').value.trim();if(!t||!(pct>0&&pct<=90)||!(h>0))return toast('Enter a title, a discount of 1-90% and hours');setCfg({flash:{on:true,title:t,pct,hours:h,expiresAt:Date.now()+h*36e5}})}
const cps=()=>[...(S.cfg.coupons||[])];
function cpAdd(){const code=$('cc').value.trim().toUpperCase(),pct=+$('cpc').value;if(!code||!(pct>0&&pct<=100))return toast('Enter a code and a percentage');const l=cps().filter(c=>c.code!==code);l.push({code,pct,on:true});setCfg({coupons:l})}
function cpTog(i){const l=cps();l[i].on=!l[i].on;setCfg({coupons:l})}
function cpDel(i){const l=cps();l.splice(i,1);setCfg({coupons:l})}
function pic(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.img=c.toDataURL('image/jpeg',.72);$('pv').src=S.img;$('pv').classList.remove('hidden')};im.src=r.result};r.readAsDataURL(f)}
function aiDesc(){const n=$('pn').value.trim();if(!n)return toast('Enter the product name first');$('pd').value=`${n}: carefully selected for quality and everyday value at Nuri Taahsib Mart. Fresh stock, honest price, and delivered to your GPS location.`}
async function pAdd(){const name=$('pn').value.trim(),pr=+$('pp').value;if(!S.img||!name||!(pr>0))return toast('Add an image, name and price');
 await db.collection('products').add({name,price:pr,desc:$('pd').value.trim()||name,img:S.img,at:Date.now()}).then(()=>{S.img='';toast('Product published 🚀');route()}).catch(()=>toast('Write blocked: check Firestore rules'))}
const pDel=id=>confirm('Delete this product?')&&db.collection('products').doc(id).delete();
const accept=id=>db.collection('orders').doc(id).update({status:'published'}).then(()=>toast('Order accepted & published ✅'));
/* ===== 3D neon scooter splash ===== */
(function(){const cv=$('c3'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,100);cam.position.set(0,1.1,6);
 const neon=(c,i=1)=>new THREE.MeshStandardMaterial({color:0x111522,emissive:c,emissiveIntensity:i,metalness:.6,roughness:.3});
 const sco=new THREE.Group(),add=(g,m,x,y,z,rz)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);if(rz)o.rotation.z=rz;sco.add(o);return o};
 add(new THREE.BoxGeometry(2.2,.22,.55),neon(0xa855f7,.9),0,0,0);add(new THREE.BoxGeometry(.9,.12,.5),neon(0xff2e97,1.1),-.7,.22,0);
 add(new THREE.CylinderGeometry(.07,.07,1.5),neon(0x22d3ee,1.2),1.1,.7,0,-.25);add(new THREE.CylinderGeometry(.05,.05,.8),neon(0x22d3ee,1.2),.95,1.4,0).rotation.x=Math.PI/2;
 add(new THREE.BoxGeometry(.9,.7,.7),neon(0xfbbf24,.8),-.6,.62,0);
 const wh=[1.15,-1.0].map(x=>add(new THREE.TorusGeometry(.36,.09,16,40),neon(0x22d3ee,1.6),x,-.3,0));
 add(new THREE.SphereGeometry(.14,16,16),new THREE.MeshBasicMaterial({color:0xffffff}),1.35,1.35,0);
 sco.rotation.x=.08;sc.add(sco);sc.add(new THREE.AmbientLight(0x6677aa,.6));
 [[0x22d3ee,4,2,4],[0xff2e97,-4,1,3]].forEach(([c,x,y,z])=>{const l=new THREE.PointLight(c,2.2,20);l.position.set(x,y,z);sc.add(l)});
 const tr=[0x22d3ee,0xa855f7,0xff2e97].map((c,i)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(5,.04,.04),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.7}));m.position.set(-3.6,-.1+i*.18,-.1+i*.1);sco.add(m);return m});
 function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();sco.scale.setScalar(Math.min(1,w/h*1.5))}size();addEventListener('resize',size);
 let t=0,run=true;(function loop(){if(!run)return;requestAnimationFrame(loop);t+=.016;sco.rotation.y=t*.7;sco.position.y=Math.sin(t*2)*.12;wh.forEach(w=>w.rotation.z-=.16);tr.forEach((m,i)=>m.scale.x=.7+Math.sin(t*5+i)*.3);R.render(sc,cam)})();
 const end=()=>{$('splash').style.opacity=0;setTimeout(()=>{$('splash').remove();run=false;R.dispose()},800)};$('splash').onclick=end;setTimeout(end,5200)})();
/* ===== PWA: inline manifest + service worker (sw.js beside index.html) ===== */
(()=>{const ic="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#0b0f19"/><text x="96" y="125" font-size="90" text-anchor="middle" fill="#22d3ee">N</text></svg>');
 const m={name:"Nuri Taahsib Mart",short_name:"NT Mart",start_url:location.href.split('#')[0],display:"standalone",background_color:"#0b0f19",theme_color:"#0b0f19",icons:[{src:ic,sizes:"192x192",type:"image/svg+xml"}]};
 const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
 if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
route();
</script></body></html>
